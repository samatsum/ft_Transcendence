services:
  nginx:
    build:
      context: .
      dockerfile: infra/docker/nginx/Dockerfile
    init: true
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # frontend サービスが生成する Vite の成果物を静的配信する
      - ./app/frontend/dist:/usr/share/nginx/html:ro
      # 初回起動で生成したローカル CA と localhost 証明書を再起動後も再利用する
      - ./infra/certs:/etc/nginx/certs
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --insecure
        - https://127.0.0.1/api/health
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      BACKEND_PORT: 3000
      DATABASE_URL: file:/data/app.db
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://localhost}
    volumes:
      - app-data:/data
    expose:
      - "3000"
    healthcheck:
      # nginx を後から接続する前に、backend 単体で HTTP 応答を確認する
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  engine-build:
    build:
      context: .
      dockerfile: infra/docker/engine-build/Dockerfile
      args:
        EMSDK_IMAGE: ${EMSDK_IMAGE:-emscripten/emsdk:latest}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - emscripten-cache:/tmp/emscripten-cache
    environment:
      EM_CACHE: /tmp/emscripten-cache
      HOME: /tmp
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    # WASM を生成し、frontend が使えるように app/frontend/public/engine/ へコピー
    command:
      - make
      - frontend-engine-assets

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    working_dir: /workspace
    depends_on:
      # WASM 生成が成功してから frontend のビルドを始める
      engine-build:
        condition: service_completed_successfully
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/node_modules
    # コンテナ内の実行ユーザーをホストユーザーに合わせる
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache
    # 依存関係をインストールし、frontend のビルドを実行
    command:
      - sh
      - -lc
      - npm ci && npm run build --workspace @ft/frontend

volumes:
  app-data:
  emscripten-cache:
  frontend-node-modules:  # JavaScript / TypeScript プロジェクトが使う外部ライブラリ
